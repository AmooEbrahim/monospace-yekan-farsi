name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make check
      - run: make specimen
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: |
            dist/*.ttf
            specimens/*.png
